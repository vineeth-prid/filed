# =============================================================================
# Filed — hardened nginx reverse proxy
# =============================================================================
# This is the AUTHORITATIVE enforcement layer for TLS, rate limiting, connection
# limits and request-body caps. The FastAPI middleware is defence-in-depth; nginx
# is what actually protects a public VPS because it runs per-edge (not per-worker)
# and sees the real client socket.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/filed
#   sudo ln -s /etc/nginx/sites-available/filed /etc/nginx/sites-enabled/filed
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certs (Let's Encrypt):
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# Run uvicorn so it trusts ONLY nginx for forwarded headers:
#   uvicorn server:app --host 127.0.0.1 --port 8000 \
#       --workers 4 --proxy-headers --forwarded-allow-ips=127.0.0.1
#
# And set in backend/.env:
#   TRUST_PROXY_HEADERS=true
#   TRUSTED_PROXY_IPS=127.0.0.1,::1
# =============================================================================

# --- Rate-limit & connection-limit zones (define once, in http{} context) ----
# If your distro's nginx.conf already has an http{} block, place these three
# limit_*_zone lines inside it (not here) and keep only the server{} blocks below.
limit_req_zone  $binary_remote_addr zone=api_general:10m rate=10r/s;   # general API
limit_req_zone  $binary_remote_addr zone=api_login:10m   rate=1r/s;    # login (brute-force)
limit_req_zone  $binary_remote_addr zone=api_insights:10m rate=12r/m;  # LLM endpoint
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;             # concurrent conns

# Trust loopback only when reading X-Forwarded-For (defence in depth with uvicorn).
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- HTTP :80 → permanent HTTPS redirect --------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Allow ACME http-01 challenge through, redirect everything else.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS :443 ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- Hardening ----
    server_tokens off;                         # hide nginx version
    client_max_body_size 64k;                  # authoritative body cap (matches app)
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_conn conn_per_ip 20;                 # max 20 concurrent connections per IP

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- Static frontend (CRA build) ----
    root /var/www/filed/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;      # SPA fallback
    }

    # ---- API proxy ----
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    # Tighter limit on the brute-forceable login route.
    location = /api/auth/login {
        limit_req zone=api_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tighter limit on the expensive local-LLM endpoint.
    location = /api/insights {
        limit_req zone=api_insights burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 160s;               # allow for model inference
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block dot-files (.env, .git) outright at the edge.
    location ~ /\.(?!well-known) { deny all; }
}
